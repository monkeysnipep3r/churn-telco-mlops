# Airflow en un solo contenedor (modo standalone), para la practica.
# Levantar:  docker compose -f docker-compose.airflow.yml up -d
# Abrir:     http://localhost:8080   (usuario: admin)
# Password:  docker compose -f docker-compose.airflow.yml exec airflow cat standalone_admin_password.txt
services:
  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-churn
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Librerias que usan las tareas. Se instalan al arrancar (tarda unos minutos la primera vez)
      _PIP_ADDITIONAL_REQUIREMENTS: "scikit-learn==1.5.2 scipy==1.13.1 matplotlib==3.9.2 joblib"
      # El modelo que entrena Airflow se guarda aparte para no pisar el de la API
      MODELOS_DIR: models_airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/proyecto
