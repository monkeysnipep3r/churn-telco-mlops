<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prediccion de churn</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; }
  label { display: block; margin-top: 10px; }
  input, select { width: 100%; padding: 5px; }
  button { margin-top: 15px; padding: 8px 16px; }
  #resultado { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
<h2>Prediccion de abandono de clientes (Telco)</h2>

<form id="formulario">
  <label>Meses como cliente (tenure)
    <input type="number" name="tenure" value="5" min="0" max="100"></label>
  <label>Cargo mensual
    <input type="number" step="0.01" name="MonthlyCharges" value="85"></label>
  <label>Cargo total
    <input type="number" step="0.01" name="TotalCharges" value="425"></label>
  <label>Adulto mayor
    <select name="SeniorCitizen"><option value="0">No</option><option value="1">Si</option></select></label>
  <label>Contrato
    <select name="Contract">
      <option>Month-to-month</option><option>One year</option><option>Two year</option>
    </select></label>
  <label>Internet
    <select name="InternetService">
      <option>Fiber optic</option><option>DSL</option><option>No</option>
    </select></label>
  <label>Metodo de pago
    <select name="PaymentMethod">
      <option>Electronic check</option><option>Mailed check</option>
      <option>Bank transfer (automatic)</option><option>Credit card (automatic)</option>
    </select></label>
  <label>Factura electronica
    <select name="PaperlessBilling"><option>Yes</option><option>No</option></select></label>
  <button type="submit">Predecir</button>
</form>

<div id="resultado"></div>

<script>
document.getElementById("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(e.target));
  for (const c of ["tenure", "SeniorCitizen"]) datos[c] = parseInt(datos[c]);
  for (const c of ["MonthlyCharges", "TotalCharges"]) datos[c] = parseFloat(datos[c]);

  const resp = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });
  const r = await resp.json();
  const caja = document.getElementById("resultado");
  if (!resp.ok) { caja.textContent = "Error en los datos: " + JSON.stringify(r.detail); return; }
  const pct = (r.probabilidad_churn * 100).toFixed(1);
  caja.textContent = r.churn
    ? `Es probable que el cliente se vaya (${pct}%)`
    : `Es probable que el cliente se quede (${pct}% de irse)`;
});
</script>
</body>
</html>
