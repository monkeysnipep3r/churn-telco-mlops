name: CI/CD churn Telco

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI: se ejecuta en cada push y pull request ----------
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Entrenar el modelo
        run: python src/entrenar.py

      - name: Correr pruebas
        run: pytest -v

      - name: Construir imagen Docker
        run: docker build -t churn-api .

      - name: Probar que el contenedor responde
        run: |
          docker run -d -p 8000:8000 --name prueba churn-api
          sleep 8
          curl --fail http://localhost:8000/health

  # ---------- CD: solo cuando hay push a main y las pruebas pasaron ----------
  publicar:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        run: |
          docker build -t $IMAGEN:latest -t $IMAGEN:${{ github.sha }} .
          docker push $IMAGEN:latest
          docker push $IMAGEN:${{ github.sha }}
